<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; form-action 'self' https:; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b">
<title>Reimposta password — NEXUS AI</title>
<style>
:root{--bg:#05070b;--panel:#0b1017;--line:#1b2634;--text:#eef4fb;--muted:#8ea0b5;--accent:#7cf5c3;--danger:#ff9696}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -10%,rgba(105,118,255,.16),transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
h1{margin:0 0 10px}p{color:var(--muted);line-height:1.5}form{display:grid;gap:12px;margin-top:18px}
input{width:100%;background:#0d111b;color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px;font:inherit}
button,a.button{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none}
button{background:var(--accent);color:#04100b}.secondary{background:#121824;color:var(--text);border:1px solid rgba(255,255,255,.14)}
.actions{display:grid;gap:10px;margin-top:12px}.notice{margin-top:14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);line-height:1.45}.error{color:var(--danger)}
</style>
</head>
<body>
<main class="card">
  <h1>Reimposta la password NEXUS</h1>
  <p>Inserisci una nuova password per il tuo account. La password viene gestita da Neon Auth e non viene salvata nella pagina.</p>
  <form id="resetForm">
    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Nuova password" required>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Conferma nuova password" required>
    <button id="submitBtn" type="submit">Salva nuova password</button>
  </form>
  <div class="notice" id="notice">Il link di reset deve provenire dall'email inviata da NEXUS.</div>
  <div class="actions"><a class="button secondary" href="https://nexusword.it/">Torna a NEXUS</a></div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@neondatabase/neon-js@0.7.0-beta';
const client=createClient('https://ep-sparkling-forest-b2v7x4ux.c-6.eu-central-1.aws.neon.tech/neondb');
const form=document.getElementById('resetForm');
const notice=document.getElementById('notice');
const token=new URLSearchParams(location.search).get('token');
if(!token){
  notice.textContent='Link di reset non valido o incompleto. Richiedi un nuovo link dalla schermata di accesso NEXUS.';
  notice.classList.add('error');
  form.querySelector('button').disabled=true;
}
form.onsubmit=async e=>{
  e.preventDefault();
  const p1=document.getElementById('newPassword').value;
  const p2=document.getElementById('confirmPassword').value;
  if(p1!==p2){notice.textContent='Le due password non coincidono.';notice.classList.add('error');return}
  if(p1.length<8){notice.textContent='La password deve avere almeno 8 caratteri.';notice.classList.add('error');return}
  notice.classList.remove('error');notice.textContent='Aggiornamento password…';
  document.getElementById('submitBtn').disabled=true;
  try{
    const r=await client.auth.resetPassword({newPassword:p1,token});
    if(r?.error)throw new Error(r.error.message||'reset_failed');
    notice.textContent='Password aggiornata. Ora puoi tornare a NEXUS e accedere con la nuova password.';
    form.reset();
    form.querySelector('button').disabled=true;
  }catch(err){
    notice.textContent='Impossibile reimpostare la password: '+(err?.message||String(err));
    notice.classList.add('error');
    document.getElementById('submitBtn').disabled=false;
  }
};
</script>
</body>
</html>
